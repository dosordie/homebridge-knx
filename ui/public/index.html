<style>
  .knx-editor-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
  }

  #editor {
    width: 100%;
    min-height: 520px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    font-size: 0.875rem;
    line-height: 1.35;
    tab-size: 2;
  }

  .knx-path {
    word-break: break-all;
  }
</style>

<div class="card mb-3">
  <div class="card-body">
    <h5 class="card-title mb-3">KNX External Configuration Editor</h5>
    <p class="mb-2">
      Edit the external KNX configuration referenced by <code>config_path</code> in the first KNX platform instance.
    </p>
    <div class="alert alert-info mb-0">
      <strong>Restart Homebridge after changes.</strong> Saving this file does not restart Homebridge automatically.
    </div>
  </div>
</div>

<div class="card mb-3">
  <div class="card-body">
    <div class="mb-3">
      <label class="form-label" for="configPath">Configured <code>config_path</code></label>
      <input id="configPath" class="form-control knx-path" type="text" readonly value="Loading...">
    </div>

    <div id="directoryPanel" class="mb-3 d-none">
      <label class="form-label" for="fileSelect">Configuration file</label>
      <select id="fileSelect" class="form-select"></select>
      <div id="directoryMessage" class="form-text"></div>
    </div>

    <div class="knx-editor-toolbar mb-3">
      <button id="reloadButton" type="button" class="btn btn-secondary">Reload</button>
      <button id="validateButton" type="button" class="btn btn-primary" disabled>Validate</button>
      <button id="saveButton" type="button" class="btn btn-success" disabled>Save</button>
    </div>

    <div id="status" class="alert alert-secondary" role="alert">Loading KNX configuration...</div>

    <label class="form-label" for="editor">File content</label>
    <textarea id="editor" class="form-control" spellcheck="false" disabled></textarea>
  </div>
</div>

<script>
  (() => {
    const configPathInput = document.getElementById('configPath');
    const directoryPanel = document.getElementById('directoryPanel');
    const directoryMessage = document.getElementById('directoryMessage');
    const fileSelect = document.getElementById('fileSelect');
    const editor = document.getElementById('editor');
    const status = document.getElementById('status');
    const reloadButton = document.getElementById('reloadButton');
    const validateButton = document.getElementById('validateButton');
    const saveButton = document.getElementById('saveButton');

    let mode = null;
    let selectedFile = null;

    function setStatus(message, type = 'secondary') {
      status.className = `alert alert-${type}`;
      status.textContent = message;
      if (window.homebridge && typeof homebridge.fixScrollHeight === 'function') {
        homebridge.fixScrollHeight();
      }
    }

    function setBusy(busy) {
      reloadButton.disabled = busy;
      validateButton.disabled = busy || !selectedFile;
      saveButton.disabled = busy || !selectedFile;
      editor.disabled = busy || !selectedFile;
    }

    function showError(error) {
      const message = error && error.message ? error.message : String(error);
      setStatus(message, 'danger');
      if (window.homebridge && homebridge.toast && homebridge.toast.error) {
        homebridge.toast.error(message, 'KNX Config Editor');
      }
    }

    function currentPayload() {
      return {
        file: mode === 'directory' ? selectedFile : undefined,
      };
    }

    async function initialise() {
      if (window.homebridge && typeof homebridge.disableSaveButton === 'function') {
        homebridge.disableSaveButton();
      }

      await loadConfigMetadata();
    }

    async function loadConfigMetadata() {
      setBusy(true);
      setStatus('Loading KNX configuration metadata...', 'secondary');
      editor.value = '';
      selectedFile = null;

      try {
        const response = await homebridge.request('/config');
        mode = response.mode;
        configPathInput.value = response.configPath || '';

        if (mode === 'directory') {
          directoryPanel.classList.remove('d-none');
          directoryMessage.textContent = response.message || 'Select a configuration file from this directory.';
          fileSelect.innerHTML = '';

          if (!response.files || response.files.length === 0) {
            const option = document.createElement('option');
            option.textContent = 'No JSON/YAML files found';
            option.value = '';
            fileSelect.appendChild(option);
            setStatus(response.message || 'config_path points to a directory; no files are available.', 'warning');
            setBusy(false);
            validateButton.disabled = true;
            saveButton.disabled = true;
            editor.disabled = true;
            return;
          }

          for (const file of response.files) {
            const option = document.createElement('option');
            option.textContent = file.relative;
            option.value = file.relative;
            fileSelect.appendChild(option);
          }

          selectedFile = fileSelect.value;
          await loadFile();
          return;
        }

        directoryPanel.classList.add('d-none');
        selectedFile = response.file ? response.file.relative : null;
        await loadFile();
      } catch (error) {
        showError(error);
        setBusy(false);
      }
    }

    async function loadFile() {
      if (!selectedFile) {
        setStatus('No file selected.', 'warning');
        setBusy(false);
        return;
      }

      setBusy(true);
      setStatus('Loading file...', 'secondary');

      try {
        const response = await homebridge.request('/load', currentPayload());
        if (response.mode === 'directory') {
          setStatus(response.message || 'Select a file first.', 'warning');
          setBusy(false);
          return;
        }

        editor.value = response.content || '';
        setStatus(`Loaded ${response.file.relative}.`, 'success');
        setBusy(false);
      } catch (error) {
        showError(error);
        setBusy(false);
      }
    }

    async function validateFile() {
      setBusy(true);
      setStatus('Validating...', 'secondary');

      try {
        const response = await homebridge.request('/validate', {
          ...currentPayload(),
          content: editor.value,
        });
        setStatus(response.message || 'Configuration is valid.', 'success');
        if (window.homebridge && homebridge.toast && homebridge.toast.success) {
          homebridge.toast.success('Configuration is valid.', 'KNX Config Editor');
        }
      } catch (error) {
        showError(error);
      } finally {
        setBusy(false);
      }
    }

    async function saveFile() {
      setBusy(true);
      setStatus('Validating and saving...', 'secondary');

      try {
        const response = await homebridge.request('/save', {
          ...currentPayload(),
          content: editor.value,
        });
        const backup = response.backup ? ` Backup: ${response.backup}.` : '';
        setStatus(`${response.message || 'Configuration saved.'}${backup}`, 'success');
        if (window.homebridge && homebridge.toast && homebridge.toast.success) {
          homebridge.toast.success('Configuration saved. Restart Homebridge after changes.', 'KNX Config Editor');
        }
      } catch (error) {
        showError(error);
      } finally {
        setBusy(false);
      }
    }

    fileSelect.addEventListener('change', async () => {
      selectedFile = fileSelect.value;
      await loadFile();
    });

    reloadButton.addEventListener('click', loadConfigMetadata);
    validateButton.addEventListener('click', validateFile);
    saveButton.addEventListener('click', saveFile);

    if (window.homebridge) {
      homebridge.addEventListener('ready', initialise);
    } else {
      setStatus('Homebridge UI API is not available.', 'danger');
    }
  })();
</script>
